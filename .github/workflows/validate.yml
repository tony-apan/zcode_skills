name: Validate release package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate package
        run: python scripts/manage.py validate
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check shell wrappers
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n scripts/install.sh scripts/release.sh
      - name: Check PowerShell installer dry-run
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Target = Join-Path $env:RUNNER_TEMP 'tony-agents-dry-run'
          ./scripts/install.ps1 --dry-run --target-dir $Target
      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open(".zcode-plugin/plugin.json", encoding="utf-8"))["version"])')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Generate SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: |
          export LC_ALL=C
          {
            find agents scripts tests -type f ! -path '*/__pycache__/*' ! -name '*.pyc' -print0
            printf '%s\0' README.md INSTALL-FOR-AI.md CHANGELOG.md LICENSE .zcode-plugin/plugin.json .github/workflows/validate.yml
          } | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload checksums
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-${{ github.ref_name }}
          path: SHA256SUMS
